<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Arial"><title>ALOHA Serverless preparation and full fine-tuning</title><desc>Pinned inputs feed one GPU job for embodiment checks and full-weight training. Complete checkpoints and an export and a training receipt are published to Object Storage. No simulator or policy evaluation is included.</desc><defs><marker id="arwN" markerWidth="12" markerHeight="12" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#12263A"/></marker><marker id="arwG" markerWidth="12" markerHeight="12" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#A6CE3A"/></marker></defs><rect width="1200" height="520" fill="#FFFFFF"/><rect x="55" y="34" width="11" height="46" fill="#A6CE3A"/><text x="82" y="70" font-family="Georgia,serif" font-size="40" font-weight="bold" fill="#12263A">ALOHA · full fine-tuning on Serverless</text><text x="84" y="108" font-family="Arial" font-size="20" fill="#56657A">One GPU job prepares the demonstrations, trains full weights, and publishes complete checkpoints.</text><text x="40" y="150" font-family="Arial" font-size="14" font-weight="bold" fill="#56657A">PINNED INPUTS</text><text x="450" y="150" font-family="Arial" font-size="14" font-weight="bold" fill="#56657A">NEBIUS SERVERLESS GPU JOB</text><text x="860" y="150" font-family="Arial" font-size="14" font-weight="bold" fill="#56657A">DURABLE ARTIFACTS</text><rect x="40" y="180" width="300" height="155" rx="14" fill="#D7E3F2" stroke="#9DB8D6" stroke-width="2.6"/><text x="190.0" y="227.0" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#12263A">ALOHA + FLUX base</text><text x="190.0" y="252.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#12263A">Dataset, channels, cameras, FPS</text><text x="190.0" y="277.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#12263A">configs/recipe.json + train.json</text><text x="190.0" y="302.0" text-anchor="middle" font-family="Arial" font-size="16" font-style="italic" font-weight="bold" fill="#2A4B6E">Step 1 · define embodiment</text><rect x="450" y="180" width="300" height="155" rx="14" fill="#12263A" stroke="#12263A" stroke-width="2.6"/><text x="600.0" y="227.0" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#FFFFFF">Prepare + train full weights</text><text x="600.0" y="252.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#FFFFFF">Validate contract; build index</text><text x="600.0" y="277.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#FFFFFF">4 or 3,000 optimizer updates</text><text x="600.0" y="302.0" text-anchor="middle" font-family="Arial" font-size="16" font-style="italic" font-weight="bold" fill="#A6CE3A">Step 2 · one H200</text><path d="M860,189.25 A150.0,19.25 0 0 1 1160,189.25 L1160,325.75 A150.0,19.25 0 0 1 860,325.75 Z" fill="#12263A" stroke="#12263A" stroke-width="2.6"/><path d="M860,189.25 A150.0,19.25 0 0 0 1160,189.25" fill="none" stroke="#12263A" stroke-width="2.6"/><text x="1010.0" y="232.0" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#FFFFFF">Object Storage</text><text x="1010.0" y="257.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#FFFFFF">Checkpoints + BF16 export</text><text x="1010.0" y="282.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#FFFFFF">SHA-256 + training receipt</text><text x="1010.0" y="307.0" text-anchor="middle" font-family="Arial" font-size="16" font-style="italic" font-weight="bold" fill="#A6CE3A">Step 3 · publish</text><polyline points="340,257 450,257" fill="none" stroke="#12263A" stroke-width="2.8" marker-end="url(#arwN)"/><polyline points="750,257 860,257" fill="none" stroke="#12263A" stroke-width="2.8" marker-end="url(#arwN)"/><rect x="40" y="375" width="1120" height="80" rx="12" fill="#EEF2F7" stroke="#12263A" stroke-width="1.6"/><rect x="62" y="393" width="13" height="13" fill="#A6CE3A"/><text x="84" y="408" font-family="Arial" font-size="17" font-weight="bold" fill="#12263A">Result</text><text x="62" y="435" font-family="Arial" font-size="15.5" fill="#243541">TRAIN_COMPLETE.json confirms the final checkpoint and export were published. Robot task success is not evaluated.</text><text x="40" y="466" font-family="Arial" font-size="18" font-weight="bold" fill="#12263A"></text><rect x="40" y="480" width="44" height="30" rx="6" fill="#D7E3F2" stroke="#9DB8D6" stroke-width="2.5"/><text x="98" y="501" font-family="Arial" font-size="16" fill="#243541">Your configuration</text><text x="450" y="466" font-family="Arial" font-size="18" font-weight="bold" fill="#12263A"></text><rect x="450" y="480" width="44" height="30" rx="6" fill="#12263A" stroke="#12263A" stroke-width="2.5"/><text x="508" y="501" font-family="Arial" font-size="16" fill="#243541">Nebius compute / storage</text></svg>