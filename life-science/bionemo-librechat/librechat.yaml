version: 1.3.15
cache: true
interface:
  customWelcome: 'BioNeMo Workbench: choose Protein Folding, Docking & Design, Sequence & MSA, or Genomics & Cell Biology. Ask “list models”, “start a benchmark”, or “show the tutorials”.'
  modelSelect: true
  parameters: true
  agents:
    use: true
    create: true
    share: false
    public: false
  prompts:
    use: true
    create: false
    share: false
    public: false
  mcpServers:
    use: true
    create: false
    share: false
    public: false
  skills:
    use: true
    create: false
    share: false
    public: false
    defaultActiveOnShare: true
  fileSearch: true
endpoints:
  agents:
    allowedProviders: ['Nebius Token Factory']
    capabilities: [deferred_tools, execute_code, web_search, artifacts, skills, tools, context, chain, subagents, run_in_background, tool_intents]
    recursionLimit: 40
    maxRecursionLimit: 80
    toolApproval:
      enabled: false
  custom:
    - name: 'Nebius Token Factory'
      apiKey: '${NEBIUS_API_KEY}'
      baseURL: 'https://api.tokenfactory.nebius.com/v1'
      models:
        default:
          - 'zai-org/GLM-5.3-Flash'
          - 'nvidia/nemotron-3-super-120b-a12b'
          - 'zai-org/GLM-5.2'
          - 'deepseek-ai/DeepSeek-V4-Pro'
          - 'moonshotai/Kimi-K2.7-Code'
        fetch: true
      titleConvo: true
      titleModel: 'zai-org/GLM-5.3-Flash'
      modelDisplayLabel: 'Token Factory'
      dropParams: ['stop']
modelSpecs:
  prioritize: true
  list:
    - name: 'bionemo-workbench'
      label: 'BioNeMo Workbench · GLM-5.3 Flash'
      description: 'Tools-enabled research workbench with the BioNeMo catalog, Tavily, skills, instant tutorial chats, instance tools, and an inline protein viewer.'
      default: true
      showOnLanding: true
      conversation_starters:
        - 'Protein Folding & Structure tutorial: list the live models in this group, show a bounded example, then design a comparable benchmark and render one successful structure inline.'
        - 'Docking & Molecular Design tutorial: list the live models in this group, show a bounded example, then design a comparable benchmark using the related skills and MCP tools.'
        - 'Sequence & MSA tutorial: list the live models in this group, show a bounded example, then design a comparable benchmark using the related skills and MCP tools.'
        - 'Genomics & Cell Biology tutorial: list the live models in this group, show a bounded example, then design a comparable benchmark using the related skills and MCP tools.'
      preset:
        endpoint: agents
        agent_id: 'agent_bionemo_workbench'
mcpServers:
  bionemo-models:
    type: streamable-http
    url: '${BIONEMO_MCP_URL}'
    headers:
      Authorization: 'Bearer ${BIONEMO_MCP_API_KEY}'
    timeout: 600000
    serverInstructions: true
  tavily:
    type: stdio
    command: node
    args: ['/opt/bionemo/tavily-mcp.mjs']
    env:
      TAVILY_API_KEY: '${TAVILY_API_KEY}'
  instance-admin:
    type: stdio
    command: python3
    args: ['/opt/bionemo/admin-mcp.py']
    env:
      BIONEMO_WORKSPACE_ROOT: '${BIONEMO_WORKSPACE_ROOT}'
    timeout: 600000
    serverInstructions: true
  protein-viewer:
    type: stdio
    command: python3
    args: ['/opt/bionemo/viewer-mcp.py']
    env:
      BIONEMO_ARTIFACT_ROOT: '${BIONEMO_ARTIFACT_ROOT}'
    timeout: 120000
    serverInstructions: true
  bionemo-artifacts:
    type: stdio
    command: python3
    args: ['/opt/bionemo/artifact-mcp.py']
    env:
      BIONEMO_MCP_URL: '${BIONEMO_MCP_URL}'
      BIONEMO_MCP_API_KEY: '${BIONEMO_MCP_API_KEY}'
      BIONEMO_ARTIFACT_ROOT: '${BIONEMO_ARTIFACT_ROOT}'
    timeout: 600000
    serverInstructions: true
