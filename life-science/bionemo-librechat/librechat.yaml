version: 1.3.15
cache: true
interface:
  customWelcome: 'Scientific AI Platform: explore hosted models, run reproducible scientific workflows, and turn verified results into interactive visualizations.'
  modelSelect: true
  parameters: true
  agents:
    use: true
    create: true
    share: false
    public: false
  prompts:
    use: true
    create: false
    share: false
    public: false
  mcpServers:
    use: true
    create: false
    share: false
    public: false
  skills:
    use: true
    create: false
    share: false
    public: false
    defaultActiveOnShare: true
  fileSearch: true
endpoints:
  agents:
    allowedProviders: ['Nebius Token Factory']
    capabilities: [deferred_tools, execute_code, web_search, artifacts, skills, tools, context, chain, subagents, run_in_background, tool_intents]
    recursionLimit: 40
    maxRecursionLimit: 80
    toolApproval:
      enabled: false
  custom:
    - name: 'Nebius Token Factory'
      apiKey: '${NEBIUS_API_KEY}'
      baseURL: 'https://api.tokenfactory.nebius.com/v1'
      models:
        default:
          - 'zai-org/GLM-5.3-Flash'
          - 'nvidia/nemotron-3-super-120b-a12b'
          - 'zai-org/GLM-5.2'
          - 'deepseek-ai/DeepSeek-V4-Pro'
          - 'moonshotai/Kimi-K2.7-Code'
        fetch: true
      titleConvo: true
      titleModel: 'zai-org/GLM-5.3-Flash'
      modelDisplayLabel: 'Token Factory'
      dropParams: ['stop']
modelSpecs:
  prioritize: true
  list:
    - name: 'scientific-ai-platform'
      label: 'Scientific AI Platform · GLM-5.3 Flash'
      description: 'Scientific assistant with Token Factory, Tavily, hosted model Apps, durable bucket workflows, and interactive result viewers.'
      default: true
      showOnLanding: true
      conversation_starters:
        - 'Show me the live Scientific AI model catalog, grouped by use case, with the best visual demo for each group.'
        - 'Fold one protein with three available structure models, compare the results, and render the structures interactively. Plan first; wait for me before running compute.'
        - 'Build a molecular docking demo from a protein and ligand, including ranked poses, a comparison table, and an interactive 3D view. Plan first.'
        - 'Show the best visual workflows for microscopy, chest X-ray, single-cell UMAP, SAM2 video tracking, synthetic physical-AI data, and speech transcription.'
      preset:
        endpoint: agents
        agent_id: 'agent_scientific_ai_platform'
mcpServers:
  bionemo-models:
    type: streamable-http
    url: '${BIONEMO_MCP_URL}'
    headers:
      Authorization: 'Bearer ${BIONEMO_MCP_API_KEY}'
    timeout: 600000
    serverInstructions: true
  tavily:
    type: stdio
    command: node
    args: ['/opt/bionemo/tavily-mcp.mjs']
    env:
      TAVILY_API_KEY: '${TAVILY_API_KEY}'
  instance-admin:
    type: stdio
    command: python3
    args: ['/opt/bionemo/admin-mcp.py']
    env:
      BIONEMO_WORKSPACE_ROOT: '${BIONEMO_WORKSPACE_ROOT}'
    timeout: 600000
    serverInstructions: true
  protein-viewer:
    type: stdio
    command: python3
    args: ['/opt/bionemo/viewer-mcp.py']
    env:
      BIONEMO_ARTIFACT_ROOT: '${BIONEMO_ARTIFACT_ROOT}'
    timeout: 120000
    serverInstructions: true
  bionemo-artifacts:
    type: stdio
    command: python3
    args: ['/opt/bionemo/artifact-mcp.py']
    env:
      BIONEMO_MCP_URL: '${BIONEMO_MCP_URL}'
      BIONEMO_MCP_API_KEY: '${BIONEMO_MCP_API_KEY}'
      BIONEMO_ARTIFACT_ROOT: '${BIONEMO_ARTIFACT_ROOT}'
    timeout: 600000
    serverInstructions: true
